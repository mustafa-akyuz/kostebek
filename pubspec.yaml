name: pothole_guard
description: Offline calisan cukur tespit uygulamasi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.5.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/app_icon_1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/pothole.tflite

